daemon off;
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    client_max_body_size 200m;
    upstream backend { server 127.0.0.1:8080; keepalive 32; }
    server {
        listen 8000;
        server_name _;
        location /public/ {
            alias /data/public/;
            add_header X-Content-Type-Options nosniff always;
        }
        # «Proponer con IA» espera al modelo en CPU: sin esta ruta propia nginx cortaría a los 60 s.
        location = /api/admin/ai_tutor/config/suggest { include /app/deploy/nginx/api_proxy_ia.conf; }
        location /api/ { include /app/deploy/nginx/api_proxy.conf; }
        location = /healthz { include /app/deploy/nginx/api_proxy.conf; }
        location / { return 404; }
    }
}
